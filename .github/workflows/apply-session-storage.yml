name: Apply safer session storage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-session-storage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move sensitive movements to session storage by default
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/js/portal.js')
          text = p.read_text(encoding='utf-8')
          old = "const getMoves=()=>{try{return JSON.parse(localStorage.getItem(MOVE_KEY)||'[]')}catch{return[]}};const setMoves=v=>localStorage.setItem(MOVE_KEY,JSON.stringify(v));"
          new = "const STORAGE_MODE_KEY='portalFolhaStorageModeV1';const getMoveStore=()=>localStorage.getItem(STORAGE_MODE_KEY)==='persistent'?localStorage:sessionStorage;if(!sessionStorage.getItem(MOVE_KEY)&&localStorage.getItem(MOVE_KEY)&&localStorage.getItem(STORAGE_MODE_KEY)!=='persistent'){sessionStorage.setItem(MOVE_KEY,localStorage.getItem(MOVE_KEY));}const getMoves=()=>{try{return JSON.parse(getMoveStore().getItem(MOVE_KEY)||'[]')}catch{return[]}};const setMoves=v=>getMoveStore().setItem(MOVE_KEY,JSON.stringify(v));"
          if old not in text:
              raise SystemExit('Expected movement storage block not found in portal.js')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('assets/js/movimentacoes-export.js')
          text = p.read_text(encoding='utf-8')
          old = "function allMoves(){try{return JSON.parse(localStorage.getItem('portalFolhaMovimentacoesV1')||'[]')}catch{return[]}}"
          new = "function allMoves(){try{const store=typeof getMoveStore==='function'?getMoveStore():sessionStorage;return JSON.parse(store.getItem('portalFolhaMovimentacoesV1')||'[]')}catch{return[]}}"
          if old not in text:
              raise SystemExit('Expected movement export storage block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/portal.js assets/js/movimentacoes-export.js
          git commit -m 'Store sensitive movements in session by default'
          git push
