name: Apply session storage to runtime copies

on:
  push:
    paths:
      - '.github/workflows/apply-session-storage-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime scripts
        shell: python
        run: |
          from pathlib import Path
          old_portal = "const getMoves=()=>{try{return JSON.parse(localStorage.getItem(MOVE_KEY)||'[]')}catch{return[]}};const setMoves=v=>localStorage.setItem(MOVE_KEY,JSON.stringify(v));"
          new_portal = "const STORAGE_MODE_KEY='portalFolhaStorageModeV1';const getMoveStore=()=>localStorage.getItem(STORAGE_MODE_KEY)==='persistent'?localStorage:sessionStorage;if(!sessionStorage.getItem(MOVE_KEY)&&localStorage.getItem(MOVE_KEY)&&localStorage.getItem(STORAGE_MODE_KEY)!=='persistent'){sessionStorage.setItem(MOVE_KEY,localStorage.getItem(MOVE_KEY));}const getMoves=()=>{try{return JSON.parse(getMoveStore().getItem(MOVE_KEY)||'[]')}catch{return[]}};const setMoves=v=>getMoveStore().setItem(MOVE_KEY,JSON.stringify(v));"
          p=Path('assets/js/portal.local.js'); t=p.read_text(encoding='utf-8')
          if old_portal in t: p.write_text(t.replace(old_portal,new_portal,1),encoding='utf-8')
          elif new_portal not in t: raise SystemExit('portal.local.js pattern not found')

          old_export = "function allMoves(){try{return JSON.parse(localStorage.getItem('portalFolhaMovimentacoesV1')||'[]')}catch{return[]}}"
          new_export = "function allMoves(){try{const store=typeof getMoveStore==='function'?getMoveStore():sessionStorage;return JSON.parse(store.getItem('portalFolhaMovimentacoesV1')||'[]')}catch{return[]}}"
          p=Path('assets/js/movimentacoes-export.local.js'); t=p.read_text(encoding='utf-8')
          if old_export in t: p.write_text(t.replace(old_export,new_export,1),encoding='utf-8')
          elif new_export not in t: raise SystemExit('movimentacoes-export.local.js pattern not found')
      - name: Commit runtime changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain assets/js/portal.local.js assets/js/movimentacoes-export.local.js)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/portal.local.js assets/js/movimentacoes-export.local.js
          git commit -m 'Apply safer storage to runtime scripts'
          git push
