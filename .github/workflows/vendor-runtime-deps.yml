name: Vendor runtime dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-runtime-deps.yml'
      - 'assets/js/app.js'
      - 'assets/js/portal.js'
      - 'assets/js/ferias.js'
      - 'assets/js/ferias-export.js'
      - 'assets/js/movimentacoes-export.js'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned browser libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vendor/xlsx assets/vendor/pdfjs-3 assets/vendor/pdfjs-4 assets/vendor/jszip assets/vendor/jspdf

          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js -o assets/vendor/xlsx/xlsx.full.min.js
          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js -o assets/vendor/pdfjs-3/pdf.min.js
          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js -o assets/vendor/pdfjs-3/pdf.worker.min.js
          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.min.mjs -o assets/vendor/pdfjs-4/pdf.min.mjs
          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs -o assets/vendor/pdfjs-4/pdf.worker.min.mjs
          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/jszip@3.10.1/dist/jszip.min.js -o assets/vendor/jszip/jszip.min.js
          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js -o assets/vendor/jspdf/jspdf.umd.min.js
          curl --fail --location --retry 3 --silent --show-error https://unpkg.com/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js -o assets/vendor/jspdf/jspdf.plugin.autotable.min.js

      - name: Build local-runtime script copies
        shell: bash
        run: |
          set -euo pipefail
          cp assets/js/app.js assets/js/app.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs#../vendor/pdfjs-4/pdf.min.mjs#g" assets/js/app.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs#assets/vendor/pdfjs-4/pdf.worker.min.mjs#g" assets/js/app.local.js

          cp assets/js/portal.js assets/js/portal.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js#assets/vendor/pdfjs-3/pdf.worker.min.js#g" assets/js/portal.local.js

          cp assets/js/ferias.js assets/js/ferias.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js#assets/vendor/pdfjs-3/pdf.worker.min.js#g" assets/js/ferias.local.js

          cp assets/js/ferias-export.js assets/js/ferias-export.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js#assets/vendor/jspdf/jspdf.umd.min.js#g" assets/js/ferias-export.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js#assets/vendor/jspdf/jspdf.plugin.autotable.min.js#g" assets/js/ferias-export.local.js

          cp assets/js/movimentacoes-export.js assets/js/movimentacoes-export.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js#assets/vendor/jspdf/jspdf.umd.min.js#g" assets/js/movimentacoes-export.local.js
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js#assets/vendor/jspdf/jspdf.plugin.autotable.min.js#g" assets/js/movimentacoes-export.local.js

      - name: Record checksums
        shell: bash
        run: |
          sha256sum assets/vendor/xlsx/xlsx.full.min.js assets/vendor/pdfjs-3/pdf.min.js assets/vendor/pdfjs-3/pdf.worker.min.js assets/vendor/pdfjs-4/pdf.min.mjs assets/vendor/pdfjs-4/pdf.worker.min.mjs assets/vendor/jszip/jszip.min.js assets/vendor/jspdf/jspdf.umd.min.js assets/vendor/jspdf/jspdf.plugin.autotable.min.js > assets/vendor/SHA256SUMS.txt

      - name: Commit generated local runtime
        shell: bash
        run: |
          if [ -z "$(git status --porcelain assets/vendor assets/js/*.local.js)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor assets/js/*.local.js
          git commit -m 'Build local runtime dependencies'
          git push
